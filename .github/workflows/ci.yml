name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-suite:
    name: Windows CPU sync, lint, and fast tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.5"

      - name: Pin Python
        run: uv python pin 3.12

      - name: Sync CPU environment
        run: uv sync --extra cpu --group dev

      - name: Ruff lint
        run: uv run --extra cpu ruff check .

      - name: Ruff format check
        run: uv run --extra cpu ruff format --check .

      - name: Fast test suite (non-slow)
        run: uv run --extra cpu pytest -m "not slow"
