preset = "modern"
vocab_size = 16384
max_seq_len = 2048
n_layers = 20
d_model = 768
n_heads = 12
n_kv_heads = 4
d_ff = 2048
norm_eps = 1e-6
rope_theta = 10000.0
qk_norm = true
attention_pattern = "hybrid"
local_window = 512
global_position_encoding = "rope"
dropout = 0.0
tie_embeddings = true
attention_impl = "auto"
layer_norm_scaling = true
gated_attention = true
# MF-108, intermediate value (2026-09-13): head_dim=96 instead of 64 or 128,
# via head_dim_override. Q/K/V/out_proj widen from 12*64=768 to 12*96=1,152.
# Real disclosed parameter cost: +15,729,920 (+11.35% over the 138,630,640
# baseline) -- exactly half of head_dim=128's own +22.69%, since 96 sits at
# the midpoint of the 64-128 interval. Motivation: head_dim=128 pushed real
# peak VRAM to ~7,462MB on this 8GB card (vs. baseline's measured 5,158.9MB),
# right at the edge of this project's own already-documented "8GB ceiling
# silently pages rather than OOMs" failure mode -- 96 is a real attempt to
# find a value that gets some of head_dim's real-field-practice benefit
# without crossing into that paging cliff. Whether it actually avoids the
# cliff is a real measurement question, not assumed from this estimate.
head_dim_override = 96
