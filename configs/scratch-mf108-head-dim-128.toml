preset = "modern"
vocab_size = 16384
max_seq_len = 2048
n_layers = 20
d_model = 768
n_heads = 12
n_kv_heads = 4
d_ff = 2048
norm_eps = 1e-6
rope_theta = 10000.0
qk_norm = true
attention_pattern = "hybrid"
local_window = 512
global_position_encoding = "rope"
dropout = 0.0
tie_embeddings = true
attention_impl = "auto"
# MF-108: head_dim=128 (via head_dim_override) instead of this preset's
# derived 64 (768/12). n_heads/n_kv_heads unchanged -- Q/K/V/out_proj widen
# from 12*64=768 to 12*128=1536, a real disclosed parameter/compute increase.
head_dim_override = 128
