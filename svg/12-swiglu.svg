<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="SwiGLU widens the token then narrows it, with a gate acting as a dimmer switch">
<defs>
<pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#DDE5EA" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5B6B78"/></marker>
</defs>
<style>
.f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.g{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.h1{font-size:19px;font-weight:700;fill:#16232E}
.sub{font-size:12.5px;fill:#5B6B78}.mut{font-size:11px;fill:#5B6B78}.tag{font-size:11px;fill:#5B6B78}
.cap{font-size:11.5px;fill:#16232E}
</style>
<rect width="880" height="360" rx="4" fill="#F2F5F7"/><rect width="880" height="360" fill="url(#g)"/>
<rect x=".5" y=".5" width="879" height="359" rx="4" fill="none" stroke="#C3D0D8"/>
<rect x="756" y="14" width="110" height="22" rx="3" fill="#E4EBF0" stroke="#C3D0D8"/>
<text x="811" y="29" class="f tag" text-anchor="middle">layers.py</text>
<text x="32" y="42" class="g h1">The thinking room has a dimmer switch (SwiGLU)</text>
<text x="32" y="63" class="g sub">Each token, entirely on its own, steps into a wider room and comes back out the same size.</text>
<rect x="40" y="152" width="92" height="56" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="86" y="178" class="f" font-size="12" text-anchor="middle">token</text><text x="86" y="195" class="g mut" text-anchor="middle">32 numbers</text>
<g stroke="#5B6B78" stroke-width="1.3" marker-end="url(#a)" fill="none">
<path d="M134 168 L134 122 L186 122"/><path d="M134 192 L134 238 L186 238"/>
</g>
<rect x="190" y="98" width="152" height="48" rx="4" fill="#DCEBE6" stroke="#2C7A62"/>
<text x="266" y="118" class="f" font-size="12" text-anchor="middle">up(x)</text><text x="266" y="135" class="g mut" text-anchor="middle">32 → 96 · the content</text>
<rect x="190" y="214" width="152" height="48" rx="4" fill="#F5E3DA" stroke="#B4532A"/>
<text x="266" y="234" class="f" font-size="12" text-anchor="middle">gate(x)</text><text x="266" y="251" class="g mut" text-anchor="middle">32 → 96 · the dimmer</text>
<rect x="362" y="214" width="112" height="48" rx="4" fill="#FFFFFF" stroke="#B4532A"/>
<path d="M374 252 C 396 252, 400 226, 424 226 L462 226" fill="none" stroke="#B4532A" stroke-width="2"/>
<text x="418" y="206" class="f" font-size="10.5" fill="#B4532A" text-anchor="middle">SiLU — smooth on/off</text>
<g stroke="#5B6B78" stroke-width="1.3" marker-end="url(#a)" fill="none">
<path d="M344 238 L358 238"/><path d="M266 146 L266 180 L506 180 L506 194"/><path d="M478 238 L506 238 L506 222"/>
</g>
<circle cx="506" cy="208" r="16" fill="#FFFFFF" stroke="#16232E" stroke-width="1.4"/>
<text x="506" y="214" class="g" font-size="16" text-anchor="middle" font-weight="700">×</text>
<text x="470" y="296" class="g mut" text-anchor="middle">"here's the idea" × "how much does it apply right now"</text>
<line x1="524" y1="208" x2="562" y2="208" stroke="#5B6B78" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="566" y="184" width="140" height="48" rx="4" fill="#DCEBE6" stroke="#2C7A62"/>
<text x="636" y="204" class="f" font-size="12" text-anchor="middle">down(...)</text><text x="636" y="221" class="g mut" text-anchor="middle">96 → 32 · squeeze back</text>
<line x1="708" y1="208" x2="740" y2="208" stroke="#5B6B78" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="744" y="180" width="96" height="56" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="792" y="206" class="f" font-size="12" text-anchor="middle">sticky note</text><text x="792" y="223" class="g mut" text-anchor="middle">back to the belt</text>
<rect x="40" y="312" width="800" height="38" rx="4" fill="#F7EFDF" stroke="#C79A2E"/>
<text x="58" y="336" class="g cap">Most of the weights live here: 9,216 of the 13,376 in each tiny_edu block — and, it is thought, much of the factual knowledge too.</text>
</svg>
