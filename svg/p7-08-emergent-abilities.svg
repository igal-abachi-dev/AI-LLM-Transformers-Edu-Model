<text x="811" y="29" class="f tag" text-anchor="middle">emergence</text>
<text x="32" y="42" class="g h1">Emergent abilities: flat, flat, flat, then not</text>
<text x="32" y="63" class="g sub">Some tasks sit at chance level as models grow, then rise sharply once past a threshold.</text>
