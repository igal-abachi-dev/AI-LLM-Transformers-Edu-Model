<rect x="112" y="216" width="14" height="4" rx="2" fill="#2C7A62"/><text x="134" y="221" class="g mut" fill="#16232E">translation</text>
<rect x="112" y="236" width="14" height="4" rx="2" fill="#1F5F8B"/><text x="134" y="241" class="g mut" fill="#16232E">3-digit arithmetic</text>
<rect x="112" y="256" width="14" height="4" rx="2" fill="#B4532A"/><text x="134" y="261" class="g mut" fill="#16232E">multi-step reasoning</text>
<text x="56" y="316" class="g mut">the jump arrives at a different size for every task</text>
<rect x="530" y="96" width="310" height="230" rx="4" fill="#F7EFDF" stroke="#C79A2E"/>
<text x="546" y="118" class="g st">Read this one with care</text>
<text x="546" y="142" class="g cap">"Emergent" describes the shape of a graph, not</text>
<text x="546" y="160" class="g cap">a mechanism. Nothing switches on inside the model.</text>
<text x="546" y="186" class="g cap">Later work showed part of the cliff is an artefact of</text>
<text x="546" y="204" class="g cap">how the task is scored: mark a 5-digit sum all-or-</text>
<text x="546" y="222" class="g cap">nothing and you get a cliff; give partial credit for</text>
<text x="546" y="240" class="g cap">each correct digit and the same runs come out as a</text>
<text x="546" y="258" class="g cap">smooth curve.</text>
<text x="546" y="284" class="g cap">Some emergence survives that correction and some</text>
<text x="546" y="302" class="g cap">does not. It is an open argument, not a settled fact.</text>
<rect x="40" y="342" width="800" height="42" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="58" y="368" class="g cap">Useful habit: when someone says an ability emerged at scale X, ask what the scoring rule was before you believe the cliff.</text>
</svg>
