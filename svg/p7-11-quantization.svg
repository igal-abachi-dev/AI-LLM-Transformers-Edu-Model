<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Quantization stores each weight with fewer bits, shrinking memory with a small accuracy cost">
<defs>
<pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#DDE5EA" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5B6B78"/></marker>
</defs>
<style>
.f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.g{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.h1{font-size:19px;font-weight:700;fill:#16232E}
.sub{font-size:12.5px;fill:#5B6B78}.mut{font-size:11px;fill:#5B6B78}.tag{font-size:11px;fill:#5B6B78}
.cap{font-size:11.5px;fill:#16232E}.bx{font-size:13px;fill:#16232E}.st{font-size:13px;font-weight:600;fill:#16232E}
</style>
<rect width="880" height="420" rx="4" fill="#F2F5F7"/><rect width="880" height="420" fill="url(#g)"/>
<rect x=".5" y=".5" width="879" height="419" rx="4" fill="none" stroke="#C3D0D8"/>
<rect x="736" y="14" width="130" height="22" rx="3" fill="#E4EBF0" stroke="#C3D0D8"/>
<text x="801" y="29" class="f tag" text-anchor="middle">int8 and 4-bit</text>
<text x="32" y="42" class="g h1">Quantization: fewer bits for each weight</text>
<text x="32" y="63" class="g sub">Training needs fine-grained numbers. Serving usually does not. Round them off and the model shrinks.</text>
<rect x="40" y="96" width="440" height="182" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="56" y="118" class="g st">The same weight, on two rulers</text>
<text x="56" y="146" class="g mut">16-bit float — very fine steps</text>
<line x1="60" y1="170" x2="460" y2="170" stroke="#C3D0D8" stroke-width="1.5"/>
<line x1="60" y1="164" x2="60" y2="176" stroke="#C3D0D8"/><line x1="70" y1="164" x2="70" y2="176" stroke="#C3D0D8"/><line x1="80" y1="164" x2="80" y2="176" stroke="#C3D0D8"/><line x1="90" y1="164" x2="90" y2="176" stroke="#C3D0D8"/><line x1="100" y1="164" x2="100" y2="176" stroke="#C3D0D8"/><line x1="110" y1="164" x2="110" y2="176" stroke="#C3D0D8"/><line x1="120" y1="164" x2="120" y2="176" stroke="#C3D0D8"/><line x1="130" y1="164" x2="130" y2="176" stroke="#C3D0D8"/><line x1="140" y1="164" x2="140" y2="176" stroke="#C3D0D8"/><line x1="150" y1="164" x2="150" y2="176" stroke="#C3D0D8"/><line x1="160" y1="164" x2="160" y2="176" stroke="#C3D0D8"/><line x1="170" y1="164" x2="170" y2="176" stroke="#C3D0D8"/><line x1="180" y1="164" x2="180" y2="176" stroke="#C3D0D8"/><line x1="190" y1="164" x2="190" y2="176" stroke="#C3D0D8"/><line x1="200" y1="164" x2="200" y2="176" stroke="#C3D0D8"/><line x1="210" y1="164" x2="210" y2="176" stroke="#C3D0D8"/><line x1="220" y1="164" x2="220" y2="176" stroke="#C3D0D8"/><line x1="230" y1="164" x2="230" y2="176" stroke="#C3D0D8"/><line x1="240" y1="164" x2="240" y2="176" stroke="#C3D0D8"/><line x1="250" y1="164" x2="250" y2="176" stroke="#C3D0D8"/><line x1="260" y1="164" x2="260" y2="176" stroke="#C3D0D8"/><line x1="270" y1="164" x2="270" y2="176" stroke="#C3D0D8"/><line x1="280" y1="164" x2="280" y2="176" stroke="#C3D0D8"/><line x1="290" y1="164" x2="290" y2="176" stroke="#C3D0D8"/><line x1="300" y1="164" x2="300" y2="176" stroke="#C3D0D8"/><line x1="310" y1="164" x2="310" y2="176" stroke="#C3D0D8"/><line x1="320" y1="164" x2="320" y2="176" stroke="#C3D0D8"/><line x1="330" y1="164" x2="330" y2="176" stroke="#C3D0D8"/><line x1="340" y1="164" x2="340" y2="176" stroke="#C3D0D8"/><line x1="350" y1="164" x2="350" y2="176" stroke="#C3D0D8"/><line x1="360" y1="164" x2="360" y2="176" stroke="#C3D0D8"/><line x1="370" y1="164" x2="370" y2="176" stroke="#C3D0D8"/><line x1="380" y1="164" x2="380" y2="176" stroke="#C3D0D8"/><line x1="390" y1="164" x2="390" y2="176" stroke="#C3D0D8"/><line x1="400" y1="164" x2="400" y2="176" stroke="#C3D0D8"/><line x1="410" y1="164" x2="410" y2="176" stroke="#C3D0D8"/><line x1="420" y1="164" x2="420" y2="176" stroke="#C3D0D8"/><line x1="430" y1="164" x2="430" y2="176" stroke="#C3D0D8"/><line x1="440" y1="164" x2="440" y2="176" stroke="#C3D0D8"/><line x1="450" y1="164" x2="450" y2="176" stroke="#C3D0D8"/><line x1="460" y1="164" x2="460" y2="176" stroke="#C3D0D8"/>
<circle cx="283" cy="170" r="5" fill="#1F5F8B"/><text x="283" y="192" class="f" font-size="10.5" fill="#1F5F8B" text-anchor="middle">0.5573</text>
<text x="56" y="220" class="g mut">4-bit integer — 16 steps in total</text>
<line x1="60" y1="244" x2="460" y2="244" stroke="#C3D0D8" stroke-width="1.5"/>
<line x1="60" y1="236" x2="60" y2="252" stroke="#8FAEC4"/><line x1="87" y1="236" x2="87" y2="252" stroke="#8FAEC4"/><line x1="113" y1="236" x2="113" y2="252" stroke="#8FAEC4"/><line x1="140" y1="236" x2="140" y2="252" stroke="#8FAEC4"/><line x1="166" y1="236" x2="166" y2="252" stroke="#8FAEC4"/><line x1="193" y1="236" x2="193" y2="252" stroke="#8FAEC4"/><line x1="220" y1="236" x2="220" y2="252" stroke="#8FAEC4"/><line x1="246" y1="236" x2="246" y2="252" stroke="#8FAEC4"/><line x1="273" y1="236" x2="273" y2="252" stroke="#8FAEC4"/><line x1="299" y1="236" x2="299" y2="252" stroke="#8FAEC4"/><line x1="326" y1="236" x2="326" y2="252" stroke="#8FAEC4"/><line x1="353" y1="236" x2="353" y2="252" stroke="#8FAEC4"/><line x1="379" y1="236" x2="379" y2="252" stroke="#8FAEC4"/><line x1="406" y1="236" x2="406" y2="252" stroke="#8FAEC4"/><line x1="432" y1="236" x2="432" y2="252" stroke="#8FAEC4"/><line x1="459" y1="236" x2="459" y2="252" stroke="#8FAEC4"/>
<circle cx="273" cy="244" r="5" fill="#B4532A"/><text x="273" y="266" class="f" font-size="10.5" fill="#B4532A" text-anchor="middle">0.5333</text>
<path d="M283 178 L275 236" fill="none" stroke="#B4532A" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
<text x="330" y="212" class="g mut">snaps to the nearest step</text>
<text x="500" y="98" class="g mut">AN 8B MODEL IN MEMORY</text>
<text x="500" y="132" class="f" font-size="11.5" fill="#16232E">bfloat16</text><rect x="500" y="140" width="300" height="18" rx="3" fill="#1F5F8B"/><text x="810" y="154" class="f" font-size="11" fill="#16232E">16 GB</text><text x="640" y="132" class="g mut">as trained</text>
<text x="500" y="186" class="f" font-size="11.5" fill="#16232E">int8</text><rect x="500" y="194" width="150" height="18" rx="3" fill="#4E86AE"/><text x="660" y="208" class="f" font-size="11" fill="#16232E">8 GB</text><text x="640" y="186" class="g mut">half</text>
<text x="500" y="240" class="f" font-size="11.5" fill="#16232E">4-bit</text><rect x="500" y="248" width="84" height="18" rx="3" fill="#2C7A62"/><text x="594" y="262" class="f" font-size="11" fill="#16232E">4.5 GB</text><text x="640" y="240" class="g mut">fits a laptop or phone</text>
<rect x="40" y="298" width="386" height="102" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="56" y="320" class="g st">What actually changes</text>
<text x="56" y="342" class="g cap">The number of weights is identical. Each one is just</text>
<text x="56" y="360" class="g cap">stored more coarsely, so every weight moves slightly</text>
<text x="56" y="378" class="g cap">and the model's answers shift slightly with them.</text>
<text x="56" y="396" class="g mut">nothing is removed — the ruler gets coarser, not shorter</text>
<rect x="454" y="298" width="386" height="102" rx="4" fill="#F7EFDF" stroke="#C79A2E"/>
<text x="470" y="320" class="g st">The trade, stated plainly</text>
<text x="470" y="342" class="g cap">Roughly 75% less memory for a small, usually</text>
<text x="470" y="360" class="g cap">acceptable drop in accuracy. Below 4 bits the drop</text>
<text x="470" y="378" class="g cap">stops being small, which is where the line sits today.</text>
<text x="470" y="396" class="g mut">measure it on your own task before trusting a benchmark</text>
</svg>
