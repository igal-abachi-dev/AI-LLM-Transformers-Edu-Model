<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" width="880" height="760" role="img" aria-label="Six stages of building a language model: data, pretraining, mid-training, post-training, evaluation and safety, deployment, with a feedback loop from deployment back to data" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#DDE5EA" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5B6B78"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#C79A2E"/></marker>
</defs>
<style>
.f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.g{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.h1{font-size:19px;font-weight:700;fill:#16232E}
.sub{font-size:12.5px;fill:#5B6B78}.mut{font-size:11px;fill:#5B6B78}.tag{font-size:11px;fill:#5B6B78}
.st{font-size:14px;font-weight:700;fill:#16232E}.chip{font-size:11.5px;fill:#16232E}
</style>
<rect width="880" height="760" rx="4" fill="#F2F5F7"/><rect width="880" height="760" fill="url(#g)"/>
<rect x=".5" y=".5" width="879" height="759" rx="4" fill="none" stroke="#C3D0D8"/>
<rect x="690" y="14" width="176" height="22" rx="3" fill="#E4EBF0" stroke="#C3D0D8"/>
<text x="778" y="29" class="f tag" text-anchor="middle">the full pipeline</text>
<text x="40" y="46" class="g h1">How a model actually gets built: six stages, one loop</text>
<text x="40" y="67" class="g sub">Pretraining is ~90% of the compute. Stages 3 and 4 are where the behaviour comes from.</text>

<rect x="40" y="96" width="800" height="80" rx="6" fill="#FAF2E0" stroke="#C79A2E"/>
<text x="56" y="126" class="g st">1 · data foundation</text>
<text x="56" y="148" class="g mut">the dominant lever</text>
<rect x="250" y="118" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="340" y="140" class="g chip" text-anchor="middle">collect and license</text>
<rect x="442" y="118" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="532" y="140" class="g chip" text-anchor="middle">dedup, filter, decontaminate</text>
<rect x="634" y="118" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="724" y="140" class="g chip" text-anchor="middle">mix + train tokenizer</text>
<path d="M440 176V190" fill="none" stroke="#5B6B78" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="40" y="198" width="800" height="80" rx="6" fill="#E6EEF4" stroke="#1F5F8B"/>
<text x="56" y="228" class="g st">2 · pretraining</text>
<text x="56" y="250" class="g mut">~90% of the compute</text>
<rect x="250" y="220" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="340" y="242" class="g chip" text-anchor="middle">scaling-law preflight</text>
<rect x="442" y="220" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="532" y="242" class="g chip" text-anchor="middle">distributed bf16 run</text>
<rect x="634" y="220" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="724" y="242" class="g chip" text-anchor="middle">base model</text>
<path d="M440 278V292" fill="none" stroke="#5B6B78" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="40" y="300" width="800" height="80" rx="6" fill="#E6EEF4" stroke="#1F5F8B"/>
<text x="56" y="330" class="g st">3 · mid-training</text>
<text x="56" y="352" class="g mut">cheap, high leverage</text>
<rect x="250" y="322" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="340" y="344" class="g chip" text-anchor="middle">long-context extension</text>
<rect x="442" y="322" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="532" y="344" class="g chip" text-anchor="middle">high-quality anneal</text>
<rect x="634" y="322" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="724" y="344" class="g chip" text-anchor="middle">code + math injection</text>
<path d="M440 380V394" fill="none" stroke="#5B6B78" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="40" y="402" width="800" height="80" rx="6" fill="#E6EEF4" stroke="#1F5F8B"/>
<text x="56" y="432" class="g st">4 · post-training</text>
<text x="56" y="454" class="g mut">where behaviour forms</text>
<rect x="250" y="424" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="340" y="446" class="g chip" text-anchor="middle">SFT on conversations</text>
<rect x="442" y="424" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="532" y="446" class="g chip" text-anchor="middle">preferences: DPO or RLHF</text>
<rect x="634" y="424" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="724" y="446" class="g chip" text-anchor="middle">RLVR + distillation</text>
<path d="M440 482V496" fill="none" stroke="#5B6B78" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="40" y="504" width="800" height="80" rx="6" fill="#E4EBF0" stroke="#5B6B78"/>
<text x="56" y="534" class="g st">5 · evaluation and safety</text>
<text x="56" y="556" class="g mut">gates every release</text>
<rect x="250" y="526" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="340" y="548" class="g chip" text-anchor="middle">benchmarks, held-out</text>
<rect x="442" y="526" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="532" y="548" class="g chip" text-anchor="middle">red-team, jailbreak</text>
<rect x="634" y="526" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="724" y="548" class="g chip" text-anchor="middle">capability evals</text>
<path d="M440 584V598" fill="none" stroke="#5B6B78" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="40" y="606" width="800" height="80" rx="6" fill="#E4EBF0" stroke="#5B6B78"/>
<text x="56" y="636" class="g st">6 · deployment and serving</text>
<text x="56" y="658" class="g mut">cost lives here</text>
<rect x="250" y="628" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="340" y="650" class="g chip" text-anchor="middle">quantize + distill</text>
<rect x="442" y="628" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="532" y="650" class="g chip" text-anchor="middle">paged KV, spec decode</text>
<rect x="634" y="628" width="180" height="36" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/><text x="724" y="650" class="g chip" text-anchor="middle">chat, agents, tools</text>

<path d="M40 646 L22 646 L22 136 L36 136" fill="none" stroke="#C79A2E" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#b)"/>

<text x="56" y="710" class="g mut">production traffic and eval failures feed the next data mix — it is a loop, not a line</text>
<rect x="56" y="728" width="12" height="12" rx="2" fill="#FAF2E0" stroke="#C79A2E"/><text x="74" y="738" class="g mut">data</text>
<rect x="150" y="728" width="12" height="12" rx="2" fill="#E6EEF4" stroke="#1F5F8B"/><text x="168" y="738" class="g mut">training</text>
<rect x="270" y="728" width="12" height="12" rx="2" fill="#E4EBF0" stroke="#5B6B78"/><text x="288" y="738" class="g mut">release and serving</text>
</svg>
