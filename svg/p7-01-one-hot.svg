<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="One-hot vectors put every word the same distance from every other word">
<defs>
<pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#DDE5EA" stroke-width="1"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5B6B78"/></marker>
</defs>
<style>
.f{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.g{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.h1{font-size:19px;font-weight:700;fill:#16232E}
.sub{font-size:12.5px;fill:#5B6B78}.mut{font-size:11px;fill:#5B6B78}.tag{font-size:11px;fill:#5B6B78}
.cap{font-size:11.5px;fill:#16232E}.bx{font-size:13px;fill:#16232E}.st{font-size:13px;font-weight:600;fill:#16232E}
</style>
<rect width="880" height="372" rx="4" fill="#F2F5F7"/><rect width="880" height="372" fill="url(#g)"/>
<rect x=".5" y=".5" width="879" height="371" rx="4" fill="none" stroke="#C3D0D8"/>
<rect x="706" y="14" width="160" height="22" rx="3" fill="#E4EBF0" stroke="#C3D0D8"/>
<text x="786" y="29" class="f tag" text-anchor="middle">before embeddings</text>
<text x="32" y="42" class="g h1">One-hot encoding: every word is an island</text>
<text x="32" y="63" class="g sub">Give each word its own slot in a 50,000-long array. "cat" is 49,999 zeros and a single one.</text>
<text x="40" y="110" class="f" font-size="12" fill="#16232E">"cat"</text><text x="40" y="126" class="g mut">slot 4,821</text>
<rect x="180" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="202" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="224" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="246" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="268" y="100" width="20" height="20" rx="2" fill="#1F5F8B" stroke="#C3D0D8"/><rect x="290" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="312" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="334" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="356" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="378" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="400" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="422" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="444" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="466" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="488" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="510" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="532" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="554" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="576" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="598" y="100" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="278" y="115" class="f" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>

<text x="40" y="160" class="f" font-size="12" fill="#16232E">"kitten"</text><text x="40" y="176" class="g mut">slot 19,204</text>
<rect x="180" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="202" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="224" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="246" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="268" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="290" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="312" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="334" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="356" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="378" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="400" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="422" y="150" width="20" height="20" rx="2" fill="#1F5F8B" stroke="#C3D0D8"/><rect x="444" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="466" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="488" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="510" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="532" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="554" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="576" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="598" y="150" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="432" y="165" class="f" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>

<text x="40" y="210" class="f" font-size="12" fill="#16232E">"refrigerator"</text><text x="40" y="226" class="g mut">slot 33,077</text>
<rect x="180" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="202" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="224" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="246" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="268" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="290" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="312" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="334" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="356" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="378" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="400" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="422" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="444" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="466" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="488" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="510" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="532" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="554" y="200" width="20" height="20" rx="2" fill="#B4532A" stroke="#C3D0D8"/><rect x="576" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/><rect x="598" y="200" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="564" y="215" class="f" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>

<text x="180" y="266" class="g mut">every other slot in all three rows is a zero — 49,980 of them, not drawn</text>
<rect x="660" y="96" width="180" height="124" rx="4" fill="#FFFFFF" stroke="#C3D0D8"/>
<text x="676" y="118" class="g st">Distance between them</text>
<text x="676" y="142" class="g cap">cat  to  kitten</text><text x="824" y="142" class="f" font-size="11.5" fill="#B4532A" text-anchor="end">1.00</text>
<text x="676" y="164" class="g cap">cat  to  refrigerator</text><text x="824" y="164" class="f" font-size="11.5" fill="#B4532A" text-anchor="end">1.00</text>
<text x="676" y="186" class="g cap">kitten  to  oven</text><text x="824" y="186" class="f" font-size="11.5" fill="#B4532A" text-anchor="end">1.00</text>
<text x="676" y="208" class="g mut">identical, every single pair</text>
<rect x="40" y="292" width="800" height="58" rx="4" fill="#F7EFDF" stroke="#C79A2E"/>
<text x="58" y="314" class="g cap">Two different words never share a slot, so the angle between any two of these arrays is exactly the same. The format cannot express</text>
<text x="58" y="334" class="g cap">that a kitten is a small cat. Every relationship a model might learn has to be built somewhere else, from scratch.</text>
</svg>
